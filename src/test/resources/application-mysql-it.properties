spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration/mysql
spring.flyway.validate-on-migrate=true
spring.flyway.clean-disabled=true
spring.flyway.baseline-on-migrate=false
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
iss.business-time.zone=Asia/Manila
iss.dashboard.follow-up.timestamp-zone=${INTERVIEW_FOLLOW_UP_TIMESTAMP_ZONE:${iss.business-time.zone}}
iss.demo-data.enabled=false
iss.notification.reminders.enabled=false
iss.notification.reminders.business-zone=${INTERVIEW_REMINDER_BUSINESS_ZONE:${iss.business-time.zone}}
