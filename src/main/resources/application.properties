spring.application.name=interview-scheduler-system
spring.main.banner-mode=off

# Logging
logging.level.root=WARN
logging.level.com.company.iss=INFO
logging.level.org.springframework=WARN
logging.level.org.hibernate=WARN
logging.level.com.vaadin=WARN
logging.level.org.atmosphere=WARN
logging.level.com.zaxxer.hikari=WARN

# MySQL datasource
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Flyway owns the production schema. Baseline is an explicit one-time rollout override only.
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration/mysql
spring.flyway.validate-on-migrate=true
spring.flyway.clean-disabled=true
spring.flyway.baseline-on-migrate=${FLYWAY_BASELINE_ON_MIGRATE:false}
spring.flyway.baseline-version=${FLYWAY_BASELINE_VERSION:1}

# JPA / Hibernate validates the Flyway-managed schema.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Session
server.servlet.session.timeout=30m
