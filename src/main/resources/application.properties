spring.application.name=interview-scheduler-system
spring.main.banner-mode=off

# Logging
logging.level.root=WARN
logging.level.com.company.iss=INFO
logging.level.org.springframework=WARN
logging.level.org.hibernate=WARN
logging.level.com.vaadin=WARN
logging.level.org.atmosphere=WARN
logging.level.com.zaxxer.hikari=WARN

# MySQL datasource
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Flyway owns the production schema. Baseline is an explicit one-time rollout override only.
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration/mysql
spring.flyway.validate-on-migrate=true
spring.flyway.clean-disabled=true
spring.flyway.baseline-on-migrate=${FLYWAY_BASELINE_ON_MIGRATE:false}
spring.flyway.baseline-version=${FLYWAY_BASELINE_VERSION:1}

# JPA / Hibernate validates the Flyway-managed schema.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Development demo data is opt-in and also requires the dev profile.
iss.demo-data.enabled=${DEMO_DATA_ENABLED:false}

# Notification secrets are supplied only by the runtime environment.
iss.notification.smtp.password=${SMTP_PASSWORD:}
iss.notification.smtp.connection-timeout=${SMTP_CONNECTION_TIMEOUT:5s}
iss.notification.smtp.read-timeout=${SMTP_READ_TIMEOUT:5s}
iss.notification.smtp.write-timeout=${SMTP_WRITE_TIMEOUT:5s}

# Scheduled reminders are opt-in. Interview schedule times are interpreted in the configured business zone.
iss.notification.reminders.enabled=${INTERVIEW_REMINDERS_ENABLED:false}
iss.notification.reminders.business-zone=${INTERVIEW_REMINDER_BUSINESS_ZONE:Asia/Manila}
iss.notification.reminders.fixed-delay=${INTERVIEW_REMINDER_SCAN_INTERVAL:5m}
iss.notification.reminders.initial-delay=${INTERVIEW_REMINDER_INITIAL_DELAY:30s}
iss.notification.reminders.batch-size=${INTERVIEW_REMINDER_BATCH_SIZE:100}
iss.notification.reminders.max-attempts=${INTERVIEW_REMINDER_MAX_ATTEMPTS:3}
iss.notification.reminders.retry-delay=${INTERVIEW_REMINDER_RETRY_DELAY:10m}
iss.notification.reminders.stale-claim-timeout=${INTERVIEW_REMINDER_STALE_CLAIM_TIMEOUT:10m}

# Session
server.servlet.session.timeout=30m

# Secure account lifecycle
iss.security.password.min-length=15
iss.security.password.max-length=64
iss.security.password.max-utf8-bytes=72
iss.security.lockout.max-failed-attempts=5
iss.security.lockout.duration=15m
iss.security.password-reset.ttl=30m
iss.security.password-reset.public-base-url=${APP_BASE_URL:}
iss.security.password-reset.signing-secret=${ACCOUNT_RESET_TOKEN_SECRET:}
